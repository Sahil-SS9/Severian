# Hermes catalog wrapper, not a distribution. Hermes PM reads
# [project].dependencies and installs them into its managed environment.
#
# Severian is published on PyPI (https://pypi.org/project/severian/) by the
# repository's own release workflow, from the tagged commit, with a build
# attestation. The exact pin keeps the plugin and the package in step;
# tests/integrations/test_hermes_plugin_packaging.py checks it against the package version.
[project]
name = "severian-plugin"
version = "0.3.13"
description = "Severian memory provider for Hermes Agent, catalog wrapper"
requires-python = ">=3.11"
dependencies = ["severian==0.3.13"]
