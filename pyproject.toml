[project]
name = "severian"
version = "0.3.0"
description = "Local-first canonical memory storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "fastapi>=0.115,<1.0",
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pyyaml>=6.0",
    "pip-audit>=2.7",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
severian = "severian.cli.app:main"
severian-serve = "severian.cli.app:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/severian"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/application", "tests/api", "tests/sdk", "tests/cli", "tests/benchmarks", "tests/mcp", "tests/integrations", "tests/gates", "tests/auth"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 false-positives: FastAPI's ``Depends`` pattern is the documented
# way to wire dependencies, and ``Query``/``Path`` defaults use
# default-argument factories.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
# The worktree venv is Python 3.12.3; the 3.11 pin was stale and breaks
# on modern stub files (numpy 2.5 pyi uses PEP 695 `type` statements,
# which need a 3.12 target).
python_version = "3.12"
strict = true
packages = ["severian"]

# Optional neural-embedding dependency: sentence_transformers / onnxruntime
# are imported lazily and only present when Granite R2 is installed. Without
# stubs they fail strict import checking; the provider degrades to the
# deterministic hash embedding when they are absent, so a missing stub is
# expected and safe. numpy is a transitive runtime dep of sentence-transformers
# (not a Severian direct dependency); its 2.x pyi files use `type` statements
# that mypy's python_version=3.11 parser rejects, so it gets the same
# treat-as-optional treatment.
[[tool.mypy.overrides]]
module = [
    "sentence_transformers", "sentence_transformers.*",
    "onnxruntime", "onnxruntime.*",
    "numpy", "numpy.*",
    "severian_native",
    # Bench scripts imported by tests via sys.path (plain scripts, not
    # packages on mypy's search path) — same treat-as-optional treatment.
    "build_semantic_quality_corpus",
    "run_embedding_benchmark",
]
ignore_missing_imports = true
