[project]
name = "severian"
version = "0.1.0"
description = "Local-first canonical memory storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "fastapi>=0.115,<1.0",
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "pyyaml>=6.0", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
severian = "severian.cli.app:main"
severian-serve = "severian.cli.app:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/severian"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/application", "tests/api", "tests/sdk", "tests/cli", "tests/benchmarks", "tests/mcp", "tests/integrations", "tests/gates"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 false-positives: FastAPI's ``Depends`` pattern is the documented
# way to wire dependencies, and ``Query``/``Path`` defaults use
# default-argument factories.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["severian"]
