name: ci

on:
  push:
    branches: [main, "audit/**", "fix/**", "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: severian
          POSTGRES_PASSWORD: severian
          POSTGRES_DB: severian
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U severian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEVERIAN_PG_DSN: postgresql://severian:severian@127.0.0.1:54329/severian
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify live PostgreSQL + pgvector reachable
        run: |
          uv run python - <<'PY'
          import os
          from severian.infrastructure.postgresql import PostgreSQLBackend
          from severian.infrastructure.pgvector_index import PGVectorIndex
          dsn = os.environ["SEVERIAN_PG_DSN"]
          repo = PostgreSQLBackend(dsn=dsn)
          repo.close()
          idx = PGVectorIndex(dsn=dsn)
          idx.close()
          print("live PostgreSQL + pgvector OK")
          PY

      - name: Lint (ruff check)
        run: uv run ruff check src/severian scripts/ tests/

      - name: Type check (mypy --strict)
        run: uv run mypy --strict src/severian tests/benchmarks

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Pure-Python lane — native wheel provably absent
        run: |
          uv pip uninstall -y severian-native || true
          uv run python - <<'PY'
          try:
              import severian_native  # noqa: F401
              raise SystemExit("severian_native unexpectedly importable in pure-Python lane")
          except ImportError:
              print("severian_native absent: pure-Python lane confirmed")
          PY

      - name: Pure-Python full suite (native-required tests must SKIP)
        run: uv run pytest -q -ra

      - name: Validate benchmark manifest
        run: uv run python -m severian.benchmarks.cli validate --manifest docs/benchmarks/manifest-v1.json

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: severian
          POSTGRES_PASSWORD: severian
          POSTGRES_DB: severian
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U severian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEVERIAN_PG_DSN: postgresql://severian:severian@127.0.0.1:54329/severian
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust lint (fmt + clippy -D warnings)
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Rust dependency audit + licence inventory
        working-directory: native
        run: |
          cargo install cargo-audit --locked
          cargo audit
          cargo install cargo-license --locked
          cargo license

      - name: Build native wheels (CPython 3.11 + 3.12)
        working-directory: native
        run: |
          uv tool run --from maturin maturin build --release -i 3.11
          uv tool run --from maturin maturin build --release -i 3.12

      - name: Install native wheel + run native test suites
        run: |
          uv sync --group dev
          uv pip install native/target/wheels/severian_native-0.1.0-*.whl
          uv run pytest -q -ra tests/unit/test_native_vector_backend.py \
            tests/integration/test_native_vector_integration.py \
            tests/gates/test_native_fallback_contract.py \
            tests/unit/test_cross_version_score_contract.py \
            tests/benchmarks/test_native_acceleration_runner.py

      - name: Native full suite (wheel installed)
        run: uv run pytest -q -ra

      - name: Uninstall native — pure-Python suite still green, native benchmark SKIPS
        run: |
          uv pip uninstall -y severian-native
          uv run pytest -q -ra tests/unit/test_cross_version_score_contract.py \
            tests/gates/test_native_fallback_contract.py \
            tests/benchmarks/test_native_acceleration_runner.py

      - name: Benchmark release gate (SQLite + live PostgreSQL)
        # Chroma lane is optional in CI: it requires a throwaway venv
        # with a vendored CVE-patched chromadb build. When absent the
        # lane is skipped and recorded as skipped_lane (never a pass);
        # the live gate is enforced on the platform lanes, which is
        # what the release contract demands.
        run: |
          uv run python scripts/run_benchmark.py \
            --manifest docs/benchmarks/manifest-v1.json \
            --pg-dsn "$SEVERIAN_PG_DSN" \
            --out /tmp/ci-benchmark
          python - <<'PY'
          import json
          result = json.load(open("/tmp/ci-benchmark/result.json"))
          assert result["gate_passed"], f"benchmark gate failed: {result['gate_failures']}"
          print("benchmark gate PASSED")
          PY
