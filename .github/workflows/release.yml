name: release

# Publishes severian to PyPI when a version tag is pushed. Trusted publishing (OIDC): no token is stored anywhere.
# One-time setup on pypi.org: a (pending) trusted publisher for project "severian", owner Sahil-SS9, repository
# Severian, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches the package version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build sdist and wheel from the tagged commit (reproducible timestamps)
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) uv build --out-dir dist
      - name: Install the wheel and import it
        run: |
          uv venv /tmp/check && uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/python -c "import severian.integrations.hermes as h; print(h.SeverianMemoryProvider.PROVIDER_VERSION)"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
